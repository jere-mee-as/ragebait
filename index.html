<style>
/* Same look as the Philchat generator. Screen 1 "What are they doing?" — a grid of situations.
   Screen 2 — "Rage bait for when they're… [situation]" → the line in a book serif → Shuffle. */
:root{
  --bg:#ffffff; --ink:#18181a; --soft:#55555c; --muted:#8b8b93; --line:#e8e8ec; --hover:#f4f4f6; --hover-soft:#f9f9fa; --fill:#f6f6f8; --pop:#ffffff; --ring:#ececf0;
  --shadow:0 12px 32px -12px rgba(20,20,30,.22),0 0 0 1px rgba(20,20,30,.06);
  --rage:#e0412f;
  --sans:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0b0c; --ink:#ececee; --soft:#b0b0b8; --muted:#76767e; --line:#222226; --hover:#17171a; --hover-soft:#121214; --fill:#131315; --pop:#141416; --ring:#202024;
  --shadow:0 16px 40px -12px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06); --rage:#ff6a57; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0b0b0c; --ink:#ececee; --soft:#b0b0b8; --muted:#76767e; --line:#222226; --hover:#17171a; --hover-soft:#121214; --fill:#131315; --pop:#141416; --ring:#202024;
  --shadow:0 16px 40px -12px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06); --rage:#ff6a57; color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.tile:active,.trigger:active,.list li:active,.textbtn:active,.icon:active,.mark:active{background:var(--hover-soft)}
.back:active{background:var(--fill)}
button:focus:not(:focus-visible),a:focus:not(:focus-visible){outline:none}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--sans);transition:background-color .4s,color .4s;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:64px 96px}
.wrap{max-width:540px;margin:0 auto;display:flex;flex-direction:column}
body:not(.on-gen) .wrap{max-width:820px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:56px}
.mark{font-size:14px;color:var(--muted);letter-spacing:.01em;text-decoration:none;border-radius:6px;transition:opacity .2s;white-space:nowrap;-webkit-touch-callout:none}
.mark:hover{opacity:.7}
.mark:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
.mark b{font-weight:500;color:var(--ink)}
.mark .gen{opacity:.6}
body.on-gen header{margin-bottom:22px}
body.on-gen .mark{font:400 15px var(--sans)}
.mark.fade{animation:markin .9s cubic-bezier(.2,.7,.2,1)}
@keyframes markin{from{opacity:0;filter:blur(2px);transform:translateY(3px)}to{opacity:1;filter:none;transform:none}}
.actions{display:flex;align-items:center;gap:4px}
.icon{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:color .2s,background-color .2s}
.icon:hover{color:var(--ink);background:var(--hover)}
.icon svg{width:16px;height:16px}
.textbtn{font:400 13px var(--sans);color:var(--muted);background:transparent;border:0;cursor:pointer;padding:8px 12px;border-radius:999px;transition:color .2s,background-color .2s}
.textbtn:hover{color:var(--ink);background:var(--hover)}

.av{position:relative;flex:none;border-radius:50%;background:var(--ring);overflow:hidden;display:inline-grid;place-items:center}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.s20{width:20px;height:20px}

/* ---------- What are they doing ---------- */
.who-h{font:400 clamp(26px,4.6vw,33px)/1.1 var(--serif);letter-spacing:-.015em;margin:0 0 36px;text-wrap:balance}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0;text-align:left;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--ink);
  padding:16px 18px 18px;border-radius:14px;opacity:0;transform:translateY(8px);animation:rise .5s cubic-bezier(.2,.7,.2,1) forwards;transition:background-color .2s,border-color .2s}
.tile .sit{font:400 19px/1.25 var(--serif);letter-spacing:-.005em;text-wrap:balance}
.tile .sit i{font-style:normal;color:var(--muted)}
.tile .ex{font:400 13px/1.4 var(--sans);color:var(--muted);text-wrap:balance}
.tile:hover{background:var(--hover-soft);border-color:var(--muted)}
.tile:hover .ex{color:var(--soft)}
@keyframes rise{to{opacity:1;transform:none}}
.leaving .tile{animation:out .32s cubic-bezier(.4,0,.6,1) forwards!important}
@keyframes out{to{opacity:0;transform:translateY(-4px) scale(.985);filter:blur(2px)}}
.any-row{display:flex;justify-content:center;margin-top:22px}
.anybtn{display:inline-flex;align-items:center;gap:8px}
.anybtn .dot{width:7px;height:7px;border-radius:50%;background:var(--rage)}
header,.who-h,.any-row{transition:opacity .32s cubic-bezier(.4,0,.6,1),filter .32s}
.wrap.swapping header,.wrap.swapping .who-h,.wrap.swapping .any-row{opacity:0;filter:blur(2px)}
#gen.leaving{animation:genout .32s cubic-bezier(.4,0,.6,1) forwards}
@keyframes genout{to{opacity:0;transform:translateY(-4px);filter:blur(2px)}}
#gen.enter>.top,#gen.enter>.line,#gen.enter>.mid,#gen.enter>.foot{opacity:0;animation:settle .7s cubic-bezier(.2,.7,.2,1) forwards}
#gen.enter>.line{animation-delay:.1s}
#gen.enter>.mid{animation-delay:.19s}
#gen.enter>.foot{animation-delay:.25s}
@keyframes settle{from{opacity:0;transform:translateY(10px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
#who.enter .who-h{animation:settle .6s cubic-bezier(.2,.7,.2,1)}

/* ---------- Generator ---------- */
.top{display:flex;align-items:center}
.picker{position:relative;flex:1;min-width:0}
.trigger{display:flex;align-items:center;gap:14px;width:100%;background:transparent;border:0;padding:8px 14px;margin-left:-14px;border-radius:999px;color:var(--ink);text-align:left;font:inherit;cursor:pointer;transition:background-color .2s}
.trigger:hover{background:var(--hover)}
.trigger .n{font:400 24px/1.2 var(--serif);letter-spacing:-.012em;min-width:0;text-wrap:balance}
.trigger .chev{margin-left:auto;width:17px;height:17px;color:var(--muted);flex:none;transition:transform .3s}
.picker.open .chev{transform:rotate(180deg)}
.trigger .chev.breathe{animation:breathe 1.5s ease-in-out}
@keyframes breathe{0%,100%{transform:none;color:var(--muted)}30%{transform:scale(1.45);color:var(--ink)}55%{transform:scale(1.05)}75%{transform:scale(1.3);color:var(--ink)}}
.pop{position:absolute;left:-14px;right:-6px;top:calc(100% + 8px);z-index:20;background:var(--pop);border-radius:14px;box-shadow:var(--shadow);padding:6px;
  opacity:0;transform:translateY(-4px) scale(.985);transform-origin:top center;pointer-events:none;transition:opacity .18s,transform .18s}
.picker.open .pop{opacity:1;transform:none;pointer-events:auto}
.list{list-style:none;margin:0;padding:0;max-height:440px;overflow-y:auto;overscroll-behavior:contain}
.list li{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px;cursor:pointer;font-size:15px;color:var(--soft)}
.list li .dot{width:7px;height:7px;border-radius:50%;background:var(--rage);flex:none}
.list li[aria-selected="true"]{color:var(--ink);font-weight:500}
.list li.act{background:var(--hover);color:var(--ink)}
.list li .tick{margin-left:auto;width:13px;height:13px;opacity:0;flex:none}
.list li[aria-selected="true"] .tick{opacity:1}
.list li.sep{height:1px;padding:0;margin:5px 8px;background:var(--line);cursor:default;pointer-events:none}

.line{margin:52px 0 0;min-height:180px}
.out{margin:0;font:400 clamp(26px,5vw,36px)/1.3 var(--serif);letter-spacing:-.012em;color:var(--ink);overflow-wrap:anywhere;text-wrap:balance}
.out.enter{animation:enter .6s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(6px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
.for{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--muted);min-height:30px}
.for b{font-weight:500;color:var(--soft)}
.for:empty{visibility:hidden}
.mid{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;margin-top:34px;padding-bottom:26px;border-bottom:1px solid var(--line)}
.foot{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:26px}
.back{display:none;align-items:center;justify-content:center;width:38px;height:38px;color:var(--soft);background:transparent;border:1px solid var(--line);border-radius:50%;padding:0;cursor:pointer;transition:border-color .2s,color .2s,transform .12s}
.back:hover{border-color:var(--muted);color:var(--ink)}
.back svg{width:16px;height:16px;transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.back:hover svg{transform:rotate(-40deg)}
.back.show{display:inline-flex;animation:backin .35s cubic-bezier(.2,.7,.2,1)}
@keyframes backin{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
.shuffle{display:inline-flex;align-items:center;gap:8px;font:500 13.5px var(--sans);color:var(--bg);background:var(--ink);border:0;border-radius:999px;padding:10px 18px 10px 15px;cursor:pointer;transition:transform .12s,background-color .4s,color .4s}
.shuffle:active{transform:scale(.96)}
.shuffle svg{width:14px;height:14px;transition:transform .5s cubic-bezier(.3,1.3,.5,1)}

.credit{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);z-index:5}
.credit b{font-weight:500;color:var(--soft)}
button:focus-visible{outline:1.5px solid var(--ink);outline-offset:2px}

@media (min-width:900px){
  body:not(.on-gen){padding-block:44px 40px}
  body:not(.on-gen) header{margin-bottom:36px}
}
@media (max-width:760px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){
  body{padding-block:36px 72px} header{margin-bottom:40px}
  .grid{gap:8px}
  .tile{padding:13px 14px 15px;gap:6px}
  .tile .sit{font-size:17px}
  .tile .ex{font-size:12.5px}
  .trigger .n{font-size:21px}
  .credit{position:static;justify-content:flex-end;margin:56px auto 0;max-width:540px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.tile{opacity:1;transform:none}}
</style>

<div class="wrap" id="wrapper">

    <a class="mark" id="home" href="#"></a>

      <button class="icon" id="copy" aria-label="Copy line" title="Copy" hidden>

      </button>
    </div>
  </header>

  <section class="screen" id="who">

const UNLOCK_AFTER = 5;
const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const shuf = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };

/* decks: no repeats until a situation (or the whole pool, for Anything) runs out */
const decks = {};
const pull = ci => { if(!decks[ci] || !decks[ci].length) decks[ci] = shuf(C[ci].a); return decks[ci].pop(); };
let anyDeck = [];
function pullAny(){
  if(!anyDeck.length) anyDeck = shuf(C.flatMap((c,ci) => c.a.map(text => ({ci, text}))));
  return anyDeck.pop();
}

let target = null, hist = [], hi = -1, pulls = 0, hinted = false;
const label = t => t === 'any' ? 'doing literally anything' : C[t].s;

function setMark(gen){
  const m = $('home');
  m.innerHTML = gen ? '<b>Rage bait</b> for when they\'re…' : '<b>Rage Bait</b> <span class="gen">Generator</span>';
  m.classList.remove('fade'); void m.offsetWidth; m.classList.add('fade');
  m.setAttribute('aria-label', gen ? 'Back to What are they doing?' : 'Rage Bait Generator');
  document.body.classList.toggle('on-gen', gen);
}

/* What are they doing */
function showWho(){
  $('gen').hidden = true; $('who').hidden = false; $('copy').hidden = true; setMark(false);
  const w = $('who'); w.classList.remove('enter'); void w.offsetWidth; w.classList.add('enter');
  const g = $('grid'); g.innerHTML = ''; g.classList.remove('leaving');
  C.forEach((c, ci) => {
    const b = document.createElement('button'); b.className = 'tile'; b.style.animationDelay = (ci*28) + 'ms';
    const s = document.createElement('span'); s.className = 'sit'; s.innerHTML = '<i>They\'re</i> '; s.append(c.s);
    const e = document.createElement('span'); e.className = 'ex'; e.textContent = '“' + c.a[0].replace(/[.…:]$/,'') + '”';
    b.append(s, e); b.onclick = () => pick(ci);
    g.appendChild(b);
  });
}
function pick(t){
  target = t;
  $('grid').classList.add('leaving'); $('wrapper').classList.add('swapping');
  setTimeout(startGen, reduced ? 0 : 320);
}
$('anybtn').onclick = () => pick('any');

function leaveGen(){
  if($('gen').hidden) return;
  closePicker(); $('gen').classList.add('leaving'); $('wrapper').classList.add('swapping');
  setTimeout(() => { $('gen').classList.remove('leaving'); showWho(); requestAnimationFrame(() => $('wrapper').classList.remove('swapping')); }, reduced ? 0 : 320);
}
try { history.replaceState({s:'who'}, ''); } catch(e){}
addEventListener('popstate', () => leaveGen());
$('home').onclick = e => {
  e.preventDefault(); if($('gen').hidden) return;
  if(history.state && history.state.s === 'gen') history.back(); else leaveGen();
};

/* Generator */
function startGen(){
  try { if(!history.state || history.state.s !== 'gen') history.pushState({s:'gen'}, ''); } catch(e){}
  $('who').hidden = true; $('gen').hidden = false; $('copy').hidden = false; setMark(true);
  pulls = 0; hinted = false;
  const g = $('gen'); g.classList.remove('enter'); void g.offsetWidth; g.classList.add('enter');
  setTimeout(() => g.classList.remove('enter'), 1100);
  requestAnimationFrame(() => requestAnimationFrame(() => $('wrapper').classList.remove('swapping')));
  setTarget(target);
}
function setTarget(t){
  target = t; hist = []; hi = -1;
  $('tname').textContent = label(t);
  go();
}
let rot = 0;
function show(item){
  const out = $('out');
  out.textContent = item.text;
  out.classList.remove('enter'); void out.offsetWidth; out.classList.add('enter');
  const f = $('for'); f.innerHTML = '';
  if(item.any){ const s = document.createElement('span'); s.innerHTML = 'for when they\'re <b></b>'; s.querySelector('b').textContent = C[item.ci].s; f.appendChild(s); }
  $('back').classList.toggle('show', hi > 0);
}
function go(){
  const item = target === 'any' ? {...pullAny(), any:true} : {ci: target, text: pull(target)};
  hist = hist.slice(0, hi + 1); hist.push(item); hi = hist.length - 1;
  rot += 180; $('shuffle').querySelector('svg').style.transform = 'rotate(' + rot + 'deg)';
  show(item);
}
function shuffleNow(){
  go(); pulls++;
  if(pulls === UNLOCK_AFTER && !hinted){ hinted = true; const ch = $('trigger').querySelector('.chev'); ch.classList.remove('breathe'); void ch.getBoundingClientRect(); ch.classList.add('breathe'); }
}
$('shuffle').onclick = shuffleNow;
$('back').onclick = () => { if(hi > 0){ hi--; show(hist[hi]); } };

/* picker */
const picker = $('picker'), list = $('list'), trigger = $('trigger');
let items = [], act = -1;
function renderList(){
  list.innerHTML = ''; items = [];
  ['any', 'sep'].concat(C.map((_,i)=>i)).forEach(key => {
    const li = document.createElement('li');
    if(key === 'sep'){ li.className = 'sep'; li.setAttribute('aria-hidden','true'); list.appendChild(li); return; }
    li.setAttribute('role','option'); li.dataset.key = key;
    li.setAttribute('aria-selected', String(String(key) === String(target)));
    if(key === 'any'){ const d = document.createElement('span'); d.className = 'dot'; li.appendChild(d); li.append('Anything'); }
    else li.append(C[key].s);
    li.insertAdjacentHTML('beforeend','<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>');
    li.onclick = () => choose(key);
    li.onmousemove = () => setAct(items.indexOf(li));
    list.appendChild(li); items.push(li);
  });
  setAct(Math.max(0, items.findIndex(li => li.getAttribute('aria-selected') === 'true')));
}
function setAct(i){ items.forEach(x=>x.classList.remove('act')); act = i; if(items[i]){ items[i].classList.add('act'); items[i].scrollIntoView({block:'nearest'}); } }
function openPicker(){ picker.classList.add('open'); trigger.setAttribute('aria-expanded','true'); renderList(); }
function closePicker(){ picker.classList.remove('open'); trigger.setAttribute('aria-expanded','false'); }
trigger.onclick = () => picker.classList.contains('open') ? closePicker() : openPicker();
document.addEventListener('click', e => { if(!picker.contains(e.target)) closePicker(); });
function choose(key){ closePicker(); trigger.focus(); setTarget(key === 'any' ? 'any' : Number(key)); }
document.addEventListener('keydown', e => {
  if(picker.classList.contains('open')){
    if(e.key === 'ArrowDown'){ e.preventDefault(); setAct(Math.min(items.length-1, act+1)); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); setAct(Math.max(0, act-1)); }
    else if(e.key === 'Enter'){ e.preventDefault(); if(items[act]) choose(items[act].dataset.key); }
    else if(e.key === 'Escape'){ closePicker(); trigger.focus(); }
    return;
  }
  if(e.code === 'Space' && !$('gen').hidden && !['INPUT','BUTTON','TEXTAREA'].includes(document.activeElement.tagName)){ e.preventDefault(); shuffleNow(); }
});

/* copy, theme */
$('copy').onclick = async () => {
  const b = $('copy'), old = b.innerHTML;
  try { await navigator.clipboard.writeText($('out').textContent); b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>'; }
  catch(e){ const r = document.createRange(); r.selectNodeContents($('out')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  setTimeout(()=>b.innerHTML = old, 1200);
};
const root = document.documentElement;
const isDark = () => { const t = root.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
try { const s = localStorage.getItem('rb-theme'); if(s) root.dataset.theme = s; } catch(e){}
$('theme').onclick = () => { const n = isDark() ? 'light' : 'dark'; root.dataset.theme = n; try{ localStorage.setItem('rb-theme', n) }catch(e){} };

if(JERE.startsWith('data:')){ const c = $('credit'), av = document.createElement('span'); av.className = 'av s20'; const img = new Image(); img.src = JERE; img.alt = ''; av.appendChild(img); c.insertBefore(av, c.querySelector('b')); }
showWho();
</script>

/* sosure shell bits: the nine themes behind the half-circle, and a few synthesized sounds */
(function(){ const $ = id => document.getElementById(id), r = document.documentElement;
  /* sound: noise hits and decaying sines, nothing loaded */
  let ctx = null, buf = null, out = null, on = true, last = 0;
  try { on = localStorage.getItem('rb-sound') !== 'off'; } catch(e){}
  function wake(){ try { if(!ctx){ ctx = new (window.AudioContext || window.webkitAudioContext)(); buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate*.03), ctx.sampleRate);
      const d = buf.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/d.length, 7); out = ctx.createGain(); out.gain.value = .8; out.connect(ctx.destination); }
    if(ctx.state === 'suspended') ctx.resume(); } catch(e){} }
  function hit(t, type, f0, q, g0, rate){ const s = ctx.createBufferSource(); s.buffer = buf; s.playbackRate.value = rate; const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = f0; f.Q.value = q; const g = ctx.createGain(); g.gain.value = g0; s.connect(f); f.connect(g); g.connect(out); s.start(t); }
  function tone(t, f0, f1, dur, g0, type){ const o = ctx.createOscillator(); o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur); const g = ctx.createGain(); g.gain.setValueAtTime(g0, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + .02); }
  const V = { tick: (t, p) => hit(t, 'bandpass', 2600*p, 1.4, .55, p), pop: (t, p) => tone(t, 760*p, 190*p, .06, .26), blip: (t, p) => tone(t, 1150*p, 1100*p, .045, .22),
    lock: (t, p) => { hit(t, 'bandpass', 3300*p, 14, 2.4, 1.3); hit(t + .011, 'bandpass', 4800*p, 16, 1.6, 1.4); } };
  function play(v, p, delay){ if(!on || !ctx || ctx.state !== 'running') return; const now = ctx.currentTime + (delay || 0); if(!delay && now - last < .028) return; if(!delay) last = now; try { V[v](now, (p || 1) * (.96 + Math.random()*.08)); } catch(e){} }
  ['pointerdown','keydown','touchstart'].forEach(ev => addEventListener(ev, wake, {passive: true, capture: true}));
  /* shuffling: a latch click, then the line lands with a pop */
  const shuffled = () => { play('lock', 1); play('pop', 1.05, .14); };
  addEventListener('click', e => { if(e.target.closest('.cp')){ play('tick', 1.5); return; } const t = e.target.closest('button,li,a'); if(!t) return;
    if(t.id === 'shuffle') shuffled(); else if(t.id === 'back') play('lock', .8);
    else if(t.id === 'copy') play('tick', 1.5); else if(t.classList.contains('pill') || t.classList.contains('tile') || t.classList.contains('chip')) play('blip', 1);
    else if(t.matches('.list li') || t.id === 'trigger') play('tick', 1.1); }, true);
  addEventListener('keydown', e => { if(e.key === ' ' && !/INPUT|TEXTAREA|BUTTON/.test(e.target.tagName)) shuffled(); else if(e.key === 'ArrowLeft' && e.target.tagName !== 'INPUT') play('lock', .8); }, true);
  const sb = $('snd'); sb.classList.toggle('muted', !on);
  sb.onclick = () => { on = !on; sb.classList.toggle('muted', !on); try { localStorage.setItem('rb-sound', on ? 'on' : 'off'); } catch(e){} if(on){ wake(); setTimeout(() => play('tick', 1), 30); } };
  /* themes: auto follows the device; the rest are fixed palettes. Ink is the default */
  const TH = [['', 'auto', '#fff', '#111'], ['day', 'day', '#fff', '#111'], ['night', 'night', '#0b0b0b', '#ebebeb'], ['paper', 'paper', '#f5efe3', '#2b241d'],
    ['newsprint', 'newsprint', '#ecebe6', '#151515'], ['rose', 'rose', '#fbf1f2', '#3d1f27'], ['ink', 'ink', '#0f2240', '#e9eef6'], ['slate', 'slate', '#1b1f24', '#dfe3e8'], ['phosphor', 'phosphor', '#060b06', '#9cf29c']];
  const box = document.createElement('div'); box.id = 'themes'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-label', 'Themes'); $('theme').parentNode.appendChild(box);
  try { const t = localStorage.getItem('rb-theme2'); if(t === null){ const o = localStorage.getItem('rb-theme'); r.dataset.theme = o === 'light' ? 'day' : o === 'dark' ? 'night' : 'ink'; } else if(t && TH.some(x => x[0] === t)) r.dataset.theme = t; else delete r.dataset.theme; } catch(e){ r.dataset.theme = 'ink'; }
  const set = k => { if(k) r.dataset.theme = k; else delete r.dataset.theme; try { localStorage.setItem('rb-theme2', k); } catch(e){} draw(); };
  function draw(){ box.innerHTML = ''; const cur = r.dataset.theme || ''; TH.forEach(([k, name, bg, ink]) => { const b = document.createElement('button'); b.setAttribute('aria-pressed', String(k === cur));
      const i = document.createElement('i'); i.textContent = 'Aa'; i.style.background = bg; i.style.color = ink; b.append(i, name); b.onclick = () => { set(k); play('tick', 1.2); }; box.appendChild(b); }); }
  const tb = $('theme'); tb.setAttribute('aria-label', 'Themes'); tb.title = 'Themes';
  tb.onclick = e => { e.stopPropagation(); box.classList.toggle('on'); draw(); play('tick', 1); };
  addEventListener('pointerdown', e => { if(box.classList.contains('on') && !e.target.closest('#themes,#theme')) box.classList.remove('on'); });
})();
</script>
<script>
(function(){ const out = document.getElementById('out'); if(!out) return;
  const mk = () => { const cp = document.createElement('span'); cp.className = 'cp'; cp.setAttribute('role', 'button'); cp.tabIndex = 0; cp.title = 'Copy'; cp.setAttribute('aria-label', 'Copy this line');
    cp.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';
    const copy = e => { e.stopPropagation(); e.preventDefault(); const txt = [...out.childNodes].filter(n => n !== cp).map(n => n.textContent).join('').trim();
      try { navigator.clipboard.writeText(txt).catch(() => {}); } catch(err){} cp.classList.add('ok'); setTimeout(() => cp.classList.remove('ok'), 1000); };
    cp.addEventListener('click', copy); cp.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' ') copy(e); }); return cp; };
  /* every new line replaces the text, so put the mark back after it */
  const add = () => { if(out.textContent.trim() && !out.querySelector('.cp')) out.appendChild(mk()); };
  new MutationObserver(add).observe(out, {childList: true}); add(); })();
</script>
